spring.application.name=ServiceDeskV1
spring.datasource.url=jdbc:postgresql://localhost:5432/servicedesk_dev
spring.datasource.username=${DB_USER}
spring.datasource.password=${DB_PASSWORD}

spring.flyway.default-schema=servicedesk

spring.jpa.hibernate.ddl-auto=validate
spring.jpa.properties.hibernate.default_schema=servicedesk
spring.jpa.open-in-view=false